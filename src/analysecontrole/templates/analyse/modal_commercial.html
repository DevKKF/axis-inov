<div  class="modal fade" id="modal-commercial" aria-hidden="true" data-backdrop="static" data-keyboard="false" style="display: none">
	<div class="modal-dialog modal-xl">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_add_portefeuille_commercial" action="{% url 'add_portefeuille_commercial' %}" method="post">
			{% csrf_token %}
			 <div class="modal-header">
				<h4 class="modal-title">ANALYSE DU PORTEFEUILLE PAR COMMERCIAL</h4>
				<button type="button"class="close"data-dismiss="modal"aria-label="Close">
					<span aria-hidden="true">×</span>
				</button>
			 </div>
			<div class="modal-body">
				<div class="alert alert-dismissible fade show hidden" role="alert">
				  <span class="message">TRAITEMENT EN COURS</span>
				</div>
				<div class="col-md-12 offset-0">

					<div class="tab-content" id="myTabContent">
						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row" style="display:none__;background:#CCCCCC;padding:10px;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px;">
								<div class="col-12 col-md-12 col-sm-12 row">
									<div class="col-md-4">
										<span class="text-right" style="margin-top:5px;">Commercial : </span>
										<select class="form-control tags-multiple" name="search_commercial" id="search_commercial" style="border:1px solid rgba(0, 0, 0, 0.3);">
											<option value="">Choisir</option>
											{% for commercial in commercials %}
												<option  value="{{commercial.id}}">{{commercial.first_name}} {{commercial.last_name}}</option>
											{% endfor %}
											<option value="AUCUN" data-commercial_id="AUCUN">Aucun commercial</option>
											<option value="TOUT" data-commercial_id="TOUT">Toute les commerciaux</option>
										</select>
									</div>
									<div class="col-md-3">
										<span class="text-right" style="margin-top:5px;">Mode renouvellement : </span>
										<select class="form-control" name="search_mode_renouvellement" id="search_mode_renouvellement" autocomplete="off">
											<option selected value="">Choisir</option>
											<option value="{{ mode_renouvellement.TACITE_RECONDUCTION }}">{{ mode_renouvellement.TACITE_RECONDUCTION }}</option>
											<option value="{{ mode_renouvellement.SANS_TACITE_RECONDUCTION }}">{{ mode_renouvellement.SANS_TACITE_RECONDUCTION }}</option>
										</select>
									</div>
									<div class="col-md-2">
										<span class="text-right" style="margin-top:5px;">Date début : </span>
										<input id="search_date_debut" class="form-control" type="date" name="search_date_debut" style="border-radius:3px;border:1px solid rgba(0, 0, 0, 0.3);text-transform:uppercase;">
									</div>
									<div class="col-md-2">
										<span class="text-right" style="margin-top:5px;">Date fin : </span>
										<input id="search_date_fin" class="form-control" type="date" name="search_date_fin" style="border-radius:3px;border:1px solid rgba(0, 0, 0, 0.3);text-transform:uppercase;">
									</div>
									<div class="col-md-1">
										<button type="button" class="btn btn-sm btn-primary btn-block mt-30" id="bouton_search_police_commercial"><i class="fa fa-search"></i> </button>
									</div>
								</div>
							</div>
							<div class="row">
								<div class="col-12 col-md-12 col-sm-12">
									<div class="alert alert-danger text-danger text-white mb-2" id="message-error" style="display: none;"></div>
									<div class="alert alert-warning text-warning text-white mb-2" id="message-warning" style="display: none;"></div>
									<div class="table-responsive" id="polices_commercial">
										<h6 class="mt-3">Liste des polices des commerciaux</h6>
										<table class="table table-bordered table-striped dataTable dtr-inline" id="table_polices_commercial">
											<thead>
												<tr>
													<th>Client</th>
													<th>Numero</th>
													<th width="10%">Date début</th>
													<th width="10%">Date échéance</th>
													<th width="12%">Mode de renouvellement</th>
													<th width="7%">Statut</th>
													<th width="10%">Date création</th>
													<th width="12%">Date résiliation</th>
													<th>Prime HT</th>
													<th>Com Courtage</th>
												</tr>
											</thead>
											<tbody class="body_tableau_police_commercial">
											</tbody>
										</table>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="modal-footer justify-content-between">
					<button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> Retour</button>
					<button type="button" id="btn_save_portefeuille_commercial" class="btn btn-info"><i class="fa fa-check-circle"></i> Importer la requête</button>
				</div>
			</div>
			</form>
		</div>
	</div>
</div>

<script>
$(document).ready(function () {

    // Désactiver le bouton au chargement
    $('#btn_save_portefeuille_commercial').prop('disabled', true);

    $('#bouton_search_police_commercial').on('click', function () {
        const commercial_id = $('#search_commercial').val();
        const mode_renouvellement = $('#search_mode_renouvellement').val();
        const date_debut = $('#search_date_debut').val();
        const date_fin = $('#search_date_fin').val();

        $('#polices_commercial').prepend('<div id="loading-msg" class="text-center mb-3 text-primary">Chargement en cours...</div>');

        $.ajax({
            url: "{% url 'get_client_by_commercial' %}",
            type: "GET",
            data: {
                commercial_id: commercial_id,
                mode_renouvellement: mode_renouvellement,
                date_debut: date_debut,
                date_fin: date_fin,
            },
            success: function (data) {
                $('#loading-msg').remove();

                const formattedData = [];

                if (Object.keys(data.polices_par_commercial).length === 0) {
                    const table = $('#table_polices_commercial').DataTable();
                    table.clear().draw();

                    // Aucun résultat => bouton désactivé
                    $('#btn_save_portefeuille_commercial').prop('disabled', true);
                    return;
                }

                $.each(data.polices_par_commercial, function (nom_commercial, info) {
                    $.each(info.polices, function (i, police) {
                        formattedData.push([
                            `${police.nom} ${police.prenoms}`,
                            police.numero,
                            police.date_debut_effet || '',
                            police.date_fin_effet || '',
                            police.mode_renouvellement || '',
                            police.statut || '',
                            police.date_creation || '',
                            police.date_resiliation || '',
                            police.prime_ht || '',
                            police.commission_courtage || ''
                        ]);
                    });
                });

                if (!$.fn.DataTable.isDataTable('#table_polices_commercial')) {
                    $('#table_polices_commercial').DataTable({
                        data: formattedData,
                        columns: [
                            { title: "Client" },
                            { title: "Numéro" },
                            { title: "Date début" },
                            { title: "Date échéance" },
                            { title: "Mode de renouvellement" },
                            { title: "Statut" },
                            { title: "Date création" },
                            { title: "Date résiliation" },
                            { title: "Prime HT" },
                            { title: "Com Courtage" }
                        ],
                        language: {
                            url: "../../static/admin_custom/js/French.json"
                        },
                        lengthMenu: [
                            [100, 250, 500, 1000, -1], [100, 250, 500, 1000, "Tout"]
                        ],
                        paging: true,
                        searching: true,
                        lengthChange: true,
                        bSort: false
                    });
                } else {
                    const table = $('#table_polices_commercial').DataTable();
                    table.clear();
                    table.rows.add(formattedData);
                    table.draw();
                }

                // Des résultats => bouton activé
                $('#btn_save_portefeuille_commercial').prop('disabled', false);
            },
            error: function (xhr, status, error) {
                $('#loading-msg').remove();
                $('#message-error').text("Erreur lors de la récupération des données.").show();

                // En cas d'erreur => désactiver aussi par sécurité
                $('#btn_save_portefeuille_commercial').prop('disabled', true);
            }
        });
    });

    // Code pour l'importation au clic sur le bouton
    $(document).on('click', "#btn_save_portefeuille_commercial", function () {
		let formulaire = $('#form_add_portefeuille_commercial');
		let href = formulaire.attr('action');

		$.validator.setDefaults({ ignore: [] });

		let formData = new FormData();

		if (formulaire.valid()) {

			let n = noty({
				text: 'Voulez-vous vraiment importer le portefeuille ?',
				type: 'warning',
				dismissQueue: true,
				layout: 'center',
				theme: 'defaultTheme',
				buttons: [
					{
						addClass: 'btn btn-primary', text: 'OUI', onClick: function ($noty) {
							$noty.close();

							// Récupérer les données du formulaire
							let data_serialized = formulaire.serialize();
							$.each(data_serialized.split('&'), function (index, elem) {
								let vals = elem.split('=');
								let key = vals[0];
								let valeur = decodeURIComponent(vals[1].replace(/\+/g, ' '));
								formData.append(key, valeur);
							});

							// 🔥 Ajouter manuellement les champs de recherche au formData
							formData.append('search_commercial', $('#search_commercial').val());
							formData.append('search_mode_renouvellement', $('#search_mode_renouvellement').val());
							formData.append('search_date_debut', $('#search_date_debut').val());
							formData.append('search_date_fin', $('#search_date_fin').val());

							$.ajax({
								type: 'post',
								url: href,
								data: formData,
								processData: false,
								contentType: false,
								success: function (response) {
									if (response.statut == 1) {
										let fileContent = response.data.file_base64;
										let filename = response.data.filename;

										let link = document.createElement("a");
										link.href = "data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64," + fileContent;
										link.download = filename;

										document.body.appendChild(link);
										link.click();
										document.body.removeChild(link);

										notifySuccess(response.message, function () {
											location.reload();
										});
									}
									else if (response.statut == 0){
										notifyWarning(response.message);
									}
									else {
										let errors = JSON.parse(JSON.stringify(response.errors));
										let errors_list_to_display = '';
										for (field in errors) {
											errors_list_to_display += '- ' + ucfirst(field) + ' : ' + errors[field] + '<br/>';
										}

										$('#modal-commercial .alert .message').html(errors_list_to_display);
										$('#modal-commercial .alert').fadeTo(2000, 500).slideUp(500).removeClass('alert-success').addClass('alert-warning');
									}
								},
								error: function (request, status, error) {
									notifyWarning("Erreur lors de l'enregistrement");
								}
							});
						}
					},
					{
						addClass: 'btn btn-danger', text: 'Annuler', onClick: function ($noty) {
							$noty.close();
						}
					}
				]
			});

		} else {
			$('label.error').css({ display: 'none', height: '0px' }).removeClass('error').text('');
			let validator = formulaire.validate();
			$.each(validator.errorMap, function (index, value) {
				console.log('Id: ' + index + ' Message: ' + value);
			});
			notifyWarning('Veuillez renseigner correctement le formulaire');
		}
	});
});
</script>
