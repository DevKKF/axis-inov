<div  class="modal fade" id="modal-commercial" aria-hidden="true" data-backdrop="static" data-keyboard="false" style="display: none">
	<div class="modal-dialog modal-xl">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_add_portefeuille_commercial" action="{% url 'add_portefeuille_commercial' %}" method="post">
			{% csrf_token %}
			 <div class="modal-header">
				<h4 class="modal-title">{{_("ANALYSE DU PORTEFEUILLE PAR COMMERCIAL")}}</h4>
				<button type="button"class="close"data-dismiss="modal"aria-label="Close">
					<span aria-hidden="true">×</span>
				</button>
			 </div>
			<div class="modal-body">
				<div class="alert alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">

					<div class="tab-content" id="myTabContent">
						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row" style="display:none__;background:#CCCCCC;padding:10px;border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px;">
								<div class="col-12 col-md-12 col-sm-12 row">
									<div class="col-md-3">
										<span class="text-right" style="margin-top:5px;">N° Police : </span>
										<input id="search_numero_police" class="form-control" type="text" name="np" style="border-radius:3px;border:1px solid rgba(0, 0, 0, 0.3);text-transform:uppercase;" placeholder="N° police">
									</div>
									<div class="col-md-3">
										<span class="text-right" style="margin-top:5px;">Client : </span>
										<select class="form-control tags-multiple" id="search_client" style="border:1px solid rgba(0, 0, 0, 0.3);">
											<option value="">Choisir</option>
											{% for client in clients %}
												<option  value="{{client.id}}">{{client.nom}} {{client.prenoms}} - ({{client.code}})</option>
											{% endfor %}
										</select>
									</div>
									<div class="col-md-3">
										<span class="text-right" style="margin-top:5px;">Produit : </span>
										<select class="form-control tags-multiple" id="search_produit" style="border:1px solid rgba(0, 0, 0, 0.3);">
											<option value="">Choisir</option>
											{% for produit in produits %}
												<option  value="{{produit.id}}">{{produit.nom}}</option>
											{% endfor %}
										</select>
									</div>
									<div class="col-md-3">
										<span class="text-right" style="margin-top:5px;">Commercial : </span>
										<select class="form-control tags-multiple" id="search_commercial" style="border:1px solid rgba(0, 0, 0, 0.3);">
											<option value="">Choisir</option>
											{% for commercial in commercials %}
												<option  value="{{commercial.id}}">{{commercial.first_name}} {{commercial.last_name}}</option>
											{% endfor %}
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="modal-footer justify-content-between">
					<button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
					<button type="button" id="btn_save_portefeuille_commercial" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Importer la requête')}}</button>
				</div>
			</div>
			</form>
		</div>
	</div>
</div>
