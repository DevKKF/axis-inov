<div  class="modal fade" id="modal-compagnie" aria-hidden="true" data-backdrop="static" data-keyboard="false" style="display: none">
	<div class="modal-dialog modal-xl">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_add_portefeuille_compagnie" action="{% url 'add_portefeuille_compagnie' %}" method="post">
			{% csrf_token %}
			 <div class="modal-header">
				<h4 class="modal-title">{{_("ANALYSE DU PORTEFEUILLE PAR COMPAGNIE")}}</h4>
				<button type="button"class="close"data-dismiss="modal"aria-label="Close">
					<span aria-hidden="true">×</span>
				</button>
			 </div>
			<div class="modal-body">
				<div class="alert alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">

					<div class="tab-content" id="myTabContent">
						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row" style="max-height:550px;">
								<div class="col-md-6">
                                    <div class="form-group row">
										<label class="col-sm-4 col-form-label">{{_('Compagnie')}} <span class="required">*</span></label>
										<div class="col-sm-8">
											<select class="form-control tags-multiple" name="compagnie_id" id="compagnie" autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												{% for compagnie in compagnies %}
													<option value="{{ compagnie.id }}" data-compagnie_id="{{ compagnie.id }}">{{ compagnie.nom }}</option>
												{% endfor %}
												<option value="TOUT" data-compagnie_id="TOUT">Toute les compagnies</option>
											</select>
										</div>
									</div>
								</div>
								<div class="vl"></div>
								<div class="col-md-5">
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Date du jour")}}</label>
										<div class="col-sm-7">
											<input type="date" class="form-control" name="date_requete" required value="{{ today|date:'Y-m-d' }}" readonly>
										</div>
									</div>
								</div>
								<br>
								<div class="col-12 col-md-12 col-sm-12" style="border-top:2px solid #F16623">
									<div class="alert alert-danger text-danger text-white mb-2" id="message-error" style="display: none;"></div>
									<div class="alert alert-warning text-warning text-white mb-2" id="message-warning" style="display: none;"></div>
									<div class="table-responsive" id="polices_compagnie" style="display:none;">
										<h3 class="mt-3">Liste des polices des compagnies</h3>
										<div class="police_compagnie_null" id="police_compagnie_null">
											<h5 class="text-center text-italic">Cette compagnie n'a pas de police...</h5>
										</div>
										<div class="police_compagnie_existe" id="police_compagnie_existe"></div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="modal-footer justify-content-between">
					<button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
					<button type="button" id="btn_save_portefeuille_compagnie" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Importer la requête')}}</button>
				</div>
			</div>
			</form>
		</div>
	</div>
</div>
