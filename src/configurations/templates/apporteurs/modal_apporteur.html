<div  class="modal fade"  id="modal-apporteur" data-backdrop="static" data-keyboard="false" aria-hidden="true"  style="display: none">
	<div class="modal-dialog modal-xl">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_add_apporteur" action="{% url 'add_apporteur' %}" method="post">
				{% csrf_token %}
				<div class="modal-header">
					<h4 class="modal-title">{{_("AJOUT D'UN APPORTEUR")}}</h4>
					<button type="button" class="close"data-dismiss="modal"aria-label="Close">
						<span aria-hidden="true">×</span>
					</button>
				</div>
				<div class="modal-body">
				<div class="alert  alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">
					<div class="tab-content" id="myTabContent">

						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row">
								<div class="col-md-6">

									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Type de personne")}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="type_personne_id" id="type_personne_id" autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												{% for type_personne in types_personnes %}
													<option value="{{ type_personne.id }}">{{ type_personne.libelle }}</option>
												{% endfor %}
											</select>
										</div>
									</div>

                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Type apporteur")}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="type_apporteur_id" id="type_apporteur_id" autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												{% for type_apporteur in types_apporteur %}
													<option value="{{ type_apporteur.id }}">{{ type_apporteur.libelle }}</option>
												{% endfor %}
											</select>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Nom')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="nom" id="nom" value="" autocomplete="off" required/>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Prénoms')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="prenoms" id="prenoms" autocomplete="off" value="" required/>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Pays')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control tags-multiple" name="pays_id" id="pays_id" autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												{% for p in pays %}
													<option value="{{ p.id }}" {% if p.code == "CI" %} selected {% endif %}>{{ p.nom }}</option>
												{% endfor %}
											</select>
										</div>
									</div>
								</div>
								<div class="vl"></div>
								<div class="col-md-5" style="border-left:0px;">
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Téléphone")}}</label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="telephone" autocomplete="off" value="" onkeypress="isInputNumber(event)">
										</div>
									</div>

									<div class="form-group row  ">
										<label class="col-sm-5 col-form-label">{{_('E-mail')}} <span class="required"></span></label>
										<div class="col-sm-7">
											<input type="text" class="form-control" id="email" name="email"/>
										</div>
									</div>

                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Adresse')}} </label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="adresse" autocomplete="off" value="" />
										</div>
									</div>

                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Statut")}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="status" autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												<option value="1" >ACTIF</option>
            									<option value="0">INACTIF</option>
											</select>
										</div>
									</div>

								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="modal-footer justify-content-between">
					<button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
					<button type="button" id="btn_save_apporteur" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Enregistrer')}}</button>
				</div>
			</div>
			</form>
		</div>
	</div>
</div>
<script>
    function isInputNumber(evt){

        var ch = String.fromCharCode(evt.which);

        if(!(/[0-9]/.test(ch))){
            evt.preventDefault();
        }
    }
</script>
