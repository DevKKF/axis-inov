<div  class="modal fade"  id="modal-garantieformule" aria-hidden="true" data-backdrop="static" data-keyboard="false" style="display: none">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_add_garantieformule" action="{% url 'add_garantieformule' %}" method="post">
			{% csrf_token %}
			 <div class="modal-header">
                    <h4 class="modal-title">{{_("AJOUT D'UNE GARANTIE / FORMULE")}}</h4>
                    <button type="button"class="close"data-dismiss="modal"aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
			<div class="modal-body">
				<div class="alert  alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">
					<ul class="nav nav-tabs" id="myTab" role="tablist">
						<li class="nav-item"><a class="nav-link active" id="identity-tab" data-toggle="tab" href="#identity" role="tab" aria-controls="identity" aria-selected="true">{{_('GENERAL')}}</a></li>
						<li class="nav-item"><a class="nav-link" id="garantie_tab-tab" data-toggle="tab" href="#garantie_tab" role="tab" aria-controls="garantie_tab" aria-selected="false">{{_('GARANTIES')}}</a></li>
					</ul>
					<div class="tab-content" id="myTabContent">

						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Formule')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="formule_id"  autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												{% for formule in formules %}
													<option value="{{ formule.id }}">{{ formule.libelle }}</option>
												{% endfor %}
											</select>
										</div>
									</div>
								</div>
								<div class="vl"></div>
								<div class="col-md-5">
                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Statut')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="status"  autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												<option value="1" >ACTIF</option>
												<option value="0">INACTIF</option>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>

						<div class="tab-pane fade mt-3" id="garantie_tab" role="tabpanel" aria-labelledby="garantie_tab-tab">
							<div class="row" style="max-height:550px;">
								<div class="col-md-12" id="test">
									<table id="table_garanties" style="width:100%;" class="table table-bordered table-striped dataTable_ dtr-inline">
										<thead>
											<tr>
												<th style="width:;">{{_("Garantie")}}</th>
												<th style="width:"></th>
											</tr>
										</thead>
										<tbody>
											<tr id="tr_initial">
												<td style="vertical-align:middle;">
													<div class="row" style="margin-right:5px;">
														<select class="form-control garantieformule" name="garantieformules" id="garantieformules" required>
															<option value="">{{_('Choisir')}}</option>
															{% for garantie in garanties %}
																<option value="{{ garantie.id }}">{{ garantie.nom|default_if_none:"" }}</option>
															{% endfor %}
														</select>
													</div>
												</td>
												<td style="vertical-align:middle;padding:5px;"><span style="cursor:pointer;" class="btn btn-sm btn-danger btnSupprimerLigneGarantie"><i class="fa fa-trash" style="font-size:12px;"></i></span></td>
											</tr>
										</tbody>
										<tfoot>
											<tr class="add-row"><td colspan="2"><span id="btnAddLigneGarantie" style="cursor:pointer;" class="btn btn-sm btn-success float-right"><i class="fa fa-plus-circle" style="font-size:12px;"></i> {{_("Ajouter")}}</span></td></tr>
										</tfoot>
									</table>
								</div>
							</div>
						</div>

					</div>
				</div>
			</div>
			<div class="modal-footer justify-content-between">
				<button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
				<button type="button" id="btn_save_garantieformule" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Enregistrer')}}</button>
			</div>
			</form>
		</div>
	</div>
</div>
