<div  class="modal fade"  id="modal-pays" data-backdrop="static" data-keyboard="false" aria-hidden="true"  style="display: none">
	<div class="modal-dialog modal-xl">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_add_pays" action="{% url 'add_pays' %}" method="post">
				{% csrf_token %}
				<div class="modal-header">
					<h4 class="modal-title">{{_("AJOUT D'UN PAYS")}}</h4>
					<button type="button" class="close"data-dismiss="modal"aria-label="Close">
						<span aria-hidden="true">×</span>
					</button>
				</div>
				<div class="modal-body">
				<div class="alert  alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">
					<div class="tab-content" id="myTabContent">

						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row">
								<div class="col-md-6">

									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Nom')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="nom" id="nom" value="" autocomplete="off" required/>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Indicatif')}}</label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="indicatif" id="indicatif" autocomplete="off" value="">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Poligamie')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="poligamie" autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												<option value="1" >OUI</option>
												<option value="0">NON</option>
											</select>
										</div>
									</div>
								</div>
								<div class="vl"></div>
								<div class="col-md-5">

									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Code')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="code" id="code" autocomplete="off" value="" required/>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Dévise')}}</label>
										<div class="col-sm-7">
											<select class="form-control tags-multiple" name="devise_id" autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												{% for devise in devises %}
													<option value="{{ devise.id }}">{{ devise.libelle }}</option>
												{% endfor %}
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="modal-footer justify-content-between">
					<button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
					<button type="button" id="btn_save_pays" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Enregistrer')}}</button>
				</div>
			</div>
			</form>
		</div>
	</div>
</div>
<script>
    function isInputNumber(evt){

        var ch = String.fromCharCode(evt.which);

        if(!(/[0-9]/.test(ch))){
            evt.preventDefault();
        }
    }
</script>
