<div  class="modal fade"  id="modal-modification_postedommage" data-backdrop="static" data-keyboard="false" aria-hidden="trued"  style="display: noned">
	<div class="modal-dialog">
		<div class="modal-content">
			<form id="form_update_postedommage" action="{% url 'modifier_postedommage' postedommage.id %}" method="post">
				{% csrf_token %}
                <div class="modal-header">
                    <h4 class="modal-title" id="mbu-title">{{_("MODIFICATION D'UN POSTE DE DOMMAGE")}}</h4>
                    <button type="button"class="close"data-dismiss="modal"aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">
				<div class="alert  alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">

					<div class="tab-content" id="myTabContent">

						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row">
								<div class="col-md-6">
                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">Numéro ordre <span class="required">*</span></label>
										<div class="col-sm-7">
											<input type="number" class="form-control" name="numero_ordre" id="numero_ordre" value="{{ postedommage.numero_ordre|default_if_none:'' }}" autocomplete="off" required/>
										</div>
									</div>
                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">Libelle <span class="required">*</span></label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="libelle" id="libelle" value="{{ postedommage.libelle|default_if_none:'' }}" autocomplete="off" required/>
										</div>
									</div>
								</div>
								<div class="vl"></div>
								<div class="col-md-5">
                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">Sens <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="sens"  autocomplete="off" required>
												<option value="">Choisir</option>
												<option value="{{sens_poste_dommage.NEGATIF}}" {% if sens_poste_dommage.NEGATIF == postedommage.sens %} selected {% endif %}>{{sens_poste_dommage.NEGATIF}}</option>
												<option value="{{sens_poste_dommage.POSITIF}}" {% if sens_poste_dommage.POSITIF == postedommage.sens %} selected {% endif %}>{{sens_poste_dommage.POSITIF}}</option>
											</select>
										</div>
									</div>
                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">Statut <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="statut"  autocomplete="off" required>
												<option value="">Choisir</option>
												<option value="1" {% if 1 == postedommage.statut %} selected {% endif %}>ACTIF</option>
												<option value="0" {% if 0 == postedommage.statut %} selected {% endif %}>INACTIF</option>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
                    <div class="modal-footer justify-content-between">
                        <button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> Retour</button>
                        <button type="button" id="btn_update_postedommage" class="btn btn-info"><i class="fa fa-check-circle"></i> Enregistrer</button>
                    </div>
                </div>
            </form>
		</div>
	</div>
</div>
<script>
	$(document).ready(function () {
        $(".tags-multiple").select2();
        $(document).on('click','#formule_tiers_payant_update-tab', function(){

            $(".select2-selection__choice__display").css("color", "#000");

        });
	});
</script>
