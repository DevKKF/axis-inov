<div  class="modal fade"  id="modal-modification_responsabilite" aria-hidden="true" data-backdrop="static" data-keyboard="false" style="display: none">
	<div class="modal-dialog modal-lg">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_update_responsabilite" action="{% url 'modifier_responsabilite' responsabilite.id %}" method="post">
			{% csrf_token %}
			 <div class="modal-header">
                    <h4 class="modal-title">{{_("MODIFICATION D'UNE RESPONSABILITE")}}</h4>
                    <button type="button"class="close"data-dismiss="modal"aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
			<div class="modal-body">
				<div class="alert  alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">

					<div class="tab-content" id="myTabContent">

						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row">
								<div class="col-md-12">
                                    <div class="form-group row">
										<label class="col-sm-3 col-form-label">{{_('Libelle')}} <span class="required">*</span></label>
										<div class="col-sm-9">
											<input type="text" class="form-control" name="libelle" id="libelle" value="{{ responsabilite.libelle|default_if_none:'' }}" autocomplete="off" required/>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-3 col-form-label">{{_("Taux de responsabilité")}} <span class="required">*</span></label>
										<div class="col-sm-9">
											<input type="text" class="form-control money_field_avec_virgule" name="taux_responsabilite" id="taux_responsabilite" value="{{ responsabilite.taux_responsabilite|default_if_none:'' }}" autocomplete="off" required/>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-3 col-form-label">{{_('Statut')}} <span class="required">*</span></label>
										<div class="col-sm-9">
											<select class="form-control" name="statut"  autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												<option value="1" {% if responsabilite.statut == 1 %} selected {% endif %}>ACTIF</option>
												<option value="0" {% if responsabilite.statut == 0 %} selected {% endif %}>INACTIF</option>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer justify-content-between">
				<button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
				<button type="button" id="btn_update_responsabilite" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Enregistrer')}}</button>
			</div>
			</form>
		</div>
	</div>
</div>
