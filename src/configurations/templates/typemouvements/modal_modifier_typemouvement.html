<div  class="modal fade"  id="modal-modification_typemouvement" data-backdrop="static" data-keyboard="false" aria-hidden="trued"  style="display: noned">
	<div class="modal-dialog">
		<div class="modal-content">
			<form id="form_update_typemouvement" action="{% url 'modifier_typemouvement' typemouvement.id %}" method="post">
				{% csrf_token %}
                <div class="modal-header">
                    <h4 class="modal-title" id="mbu-title">{{_("MODIFICATION D'UN TYPE DE MOUVEMENT")}}</h4>
                    <button type="button"class="close"data-dismiss="modal"aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">
				<div class="alert  alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">

					<div class="tab-content" id="myTabContent">

						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row">
								<div class="col-md-6">
                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Libelle')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<input type="text" class="form-control" name="libelle" id="libelle" value="{{ typemouvement.libelle|default_if_none:'' }}" autocomplete="off" required/>
										</div>
									</div>
								</div>
								<div class="vl"></div>
								<div class="col-md-5">
                                    <div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_('Statut')}} <span class="required">*</span></label>
										<div class="col-sm-7">
											<select class="form-control" name="statut"  autocomplete="off" required>
												<option value="">{{_('Choisir')}}</option>
												<option value="1" {% if 1 == typemouvement.statut %} selected {% endif %}>ACTIF</option>
												<option value="0" {% if 0 == typemouvement.statut %} selected {% endif %}>INACTIF</option>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
                    <div class="modal-footer justify-content-between">
                        <button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
                        <button type="button" id="btn_update_typemouvement" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Enregistrer')}}</button>
                    </div>
                </div>
            </form>
		</div>
	</div>
</div>
<script>
	$(document).ready(function () {
        $(".tags-multiple").select2();
        $(document).on('click','#formule_tiers_payant_update-tab', function(){

            $(".select2-selection__choice__display").css("color", "#000");

        });
	});
</script>
