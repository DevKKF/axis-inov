<div  class="modal fade"  id="modal-modification_acompte" aria-hidden="true" data-backdrop="static" data-keyboard="false" style="display: none">
	<div class="modal-dialog">
		<div class="modal-content">
			<form enctype="multipart/form-data" id="form_update_acompte" action="{% url 'modifier_acompte' acompte.id %}" method="post">
			{% csrf_token %}
			 <div class="modal-header">
                    <h4 class="modal-title f-bold"></h4>
                    <button type="button"class="close"data-dismiss="modal"aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
			<div class="modal-body">
				<div class="alert  alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">

					<div class="tab-content" id="myTabContent">

						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row">
								<div class="col-md-6">
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Montant")}} <span class="required">*</span></label>
										<div class="col-sm-7">
										<input type="text" class="form-control money_field" name="montant" id="montant_modification" value="{{ acompte.credit|default_if_none:'0' }}" required/>
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Date de versement")}} <span class="required">*</span></label>
										<div class="col-sm-7">
										<input type="date" class="form-control" name="date_versement" id="date_versement" value="{{ acompte.date_versement|date:'Y-m-d'|default_if_none:'' }}" required/>
										</div>
									</div>
								</div>
								<div class="vl"></div>
								<div class="col-md-5">
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Période début")}} </label>
										<div class="col-sm-7">
											<input type="date" class="form-control" name="periode_debut" id="periode_debut_modification" value="{{ acompte.periode_debut|date:'Y-m-d'|default_if_none:'' }}">
										</div>
									</div>
									<div class="form-group row">
										<label class="col-sm-5 col-form-label">{{_("Période fin")}}</label>
										<div class="col-sm-7">
											<input type="date" class="form-control" name="periode_fin" id="periode_fin_modification" value="{{ acompte.periode_fin|date:'Y-m-d'|default_if_none:'' }}">
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer justify-content-between">
				<button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
				<button type="button" id="btn_save_modification_acompte" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Enregistrer')}}</button>
			</div>
			</form>
		</div>
	</div>
</div>
