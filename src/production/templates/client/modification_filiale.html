{% load i18n static jazzmin admin_urls %}
<div class="modal fade" id="modal-modification_filiale" data-backdrop="static" data-keyboard="false" aria-hidden="true" style="display: none">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <form method="post" action="{% url 'modifier_filiale' filiale.id %}" id="form_update_filiale">
        {% csrf_token %}
          <input type="hidden" id="client_id" name="client_id" value="{{ client.id }}"/>
          <input type="hidden" id="filiale_id" name="filiale_id" value="{{ filiale.id }}"/>
          <div class="modal-header">
            <h4 class="modal-title">{{_("MODIFICATION D'UNE FILIALE")}}</h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
          </div>
       <div class="modal-body">
       <div class="alert  alert-dismissible fade show hidden" role="alert">
          <span class="message"> {{_("TRAITEMENT EN COURS")}}</span>
       </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group row">
                    <label class="col-sm-5 col-form-label">{{_('Nom')}} <span class="required">*</span></label>
                    <div class="col-sm-7">
                    <input type="text" class="form-control" name="nom" value="{{ filiale.nom|default_if_none:'' }}" required/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-5 col-form-label">{{_('Pays')}} </label>
                    <div class="col-sm-7">
                        <select name="pays" class="form-control tags-multiple">
                            <option value="">{{_('Choisir')}}</option>
                            {% for p in pays %}
                                <option value="{{ p.id }}" {% if filiale.pays.id == p.id %} selected {% endif %}>{{ p.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
            <div class="vl"></div>
            <div class="col-md-5">
                <div class="form-group row">
                    <label class="col-sm-5 col-form-label">{{_('Adresse')}} <span class="required">*</span></label>
                    <div class="col-sm-7">
                    <input type="text" class="form-control" name="adresse" value="{{ filiale.adresse|default_if_none:''}}" required/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-5 col-form-label">{{_('Ville')}}</label>
                    <div class="col-sm-7">
                    <input type="text" class="form-control" name="ville" value="{{ filiale.ville|default_if_none:'' }}"/>
                    </div>
                </div>
            </div>
        </div>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
        <button type="button" id="btn_save_modification_filiale" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Enregistrer')}}</button>
      </div>
      </form>
    </div>
  </div>
</div>
