<div class="modal fade" id="modal-modification_intervenant" data-backdrop="static" data-keyboard="false" aria-hidden="true" style="display: none">
  <div class="modal-dialog modal-xl" style="width:;">
    <div class="modal-content">
      <form enctype="multipart/form-data" method="post" action="{% url 'modifier_intervenant' intervenant.id %}" id="form_modification_intervenant_sinistre">
      {% csrf_token %}
      <input type="hidden" id="intervenant_id" name="intervenant_id" value="{{ intervenant.id }}"/>
      <div class="modal-header">
        <h4 class="modal-title"></h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
      </div>
       <div class="modal-body">
				<div class="alert  alert-dismissible fade show hidden" role="alert">
				  <span class="message">{{_("TRAITEMENT EN COURS")}}</span>
				</div>
				<div class="col-md-12 offset-0">
					<ul class="nav nav-tabs" id="myTab" role="tablist">
						<li class="nav-item"><a class="nav-link active" id="identity-tab" data-toggle="tab" href="#identity" role="tab" aria-controls="identity" aria-selected="true">{{_('COORDONNEES')}}</a></li>
						<li class="nav-item"><a class="nav-link" id="adresse-tab" data-toggle="tab" href="#adresse" role="tab" aria-controls="adresse" aria-selected="false">{{_('ADRESSES')}}</a></li>
					</ul>
					<div class="tab-content" id="myTabContent">

						<div class="tab-pane fade show active mt-3" id="identity" role="tabpanel" aria-labelledby="identity-tab">
							<div class="row">
                                <div class="col-md-6">
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Type intervenant <span class="required">*</span></label>
									<div class="col-sm-7">
										<select class="form-control typeintervenant intervenant_champ_obligatoire" name="type_intervenant_id" id="type_intervenant_id" required>
											<option value="">Choisir</option>
											{% for typeintervenant in typeintervenants %}
												<option value="{{ typeintervenant.id }}" {% if typeintervenant.id == intervenant.type_intervenant_id %} selected {% endif %}>{{ typeintervenant.libelle|default_if_none:"" }}</option>
											{% endfor %}
										</select>
									</div>
								</div>

								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Prénoms</label>
									<div class="col-sm-7">
										<input type="text" class="form-control" name="prenoms" id="prenoms" autocomplete="off" value="{{ intervenant.prenoms|default_if_none:'' }}">
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Téléphone</label>
									<div class="col-sm-7">
										<input type="text" class="form-control" name="telephone" id="telephone" autocomplete="off" value="{{ intervenant.telephone|default_if_none:'' }}" onkeypress="isInputNumber(event)">
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Email</label>
									<div class="col-sm-7">
										<input type="email" class="form-control" name="email" id="email" autocomplete="off" value="{{ intervenant.email|default_if_none:'' }}">
									</div>
								</div>
							</div>
                                <div class="vl"></div>
                                <div class="col-md-5" style="border-left:0px;">

								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Nom <span class="required">*</span></label>
									<div class="col-sm-7">
										<input type="text" class="form-control intervenant_champ_obligatoire" name="nom" id="nom" autocomplete="off" value="{{ intervenant.nom|default_if_none:'' }}" required>
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Portable <span class="required">*</span></label>
									<div class="col-sm-7">
										<input type="text" class="form-control intervenant_champ_obligatoire" name="portable" id="portable" autocomplete="off" value="{{ intervenant.portable|default_if_none:'' }}" onkeypress="isInputNumber(event)" required>
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Fax</label>
									<div class="col-sm-7">
										<input type="text" class="form-control" name="fax" id="fax" autocomplete="off" onkeypress="isInputNumber(event)" value="{{ intervenant.fax|default_if_none:'' }}">
									</div>
								</div>
							</div>
							</div>
						</div>

						<div class="tab-pane fade mt-3" id="adresse" role="tabpanel" aria-labelledby="adresse-tab">
							<div class="row">
                                <div class="col-md-6">
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Code postal</label>
									<div class="col-sm-7">
										<input type="text" class="form-control" name="code_postal" id="code_postal" autocomplete="off" value="{{ intervenant.code_postal|default_if_none:'' }}">
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Pays <span class="required">*</span></label>
									<div class="col-sm-7">
										<select class="form-control tags-multiple intervenant_champ_obligatoire" name="pays_id" id="pays_id" autocomplete="off" required>
											<option value="">Choisir</option>
											{% for p in pays %}
												<option {% if p.id == intervenant.pays_id %} selected {% endif %} value="{{ p.id }}">{{ p.nom }}</option>
											{% endfor %}
										</select>
									</div>
								</div>
							</div>
                                <div class="vl"></div>
                                <div class="col-md-5" style="border-left:0px;">
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Boite postale</label>
									<div class="col-sm-7">
										<input type="text" class="form-control" name="boite_postale" id="boite_postale" autocomplete="off" value="{{ intervenant.boite_postale|default_if_none:'' }}">
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-5 col-form-label">Ville</label>
									<div class="col-sm-7">
										<input type="text" class="form-control" name="ville" id="ville" autocomplete="off" value="{{ intervenant.ville|default_if_none:'' }}">
									</div>
								</div>
							</div>
							</div>
						</div>
					</div>
				</div>
			</div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-danger" data-dismiss="modal"><i class="fa fa-remove"></i> {{_('Retour')}}</button>
        <button type="button" id="btn_save_modification_intervenant_sinistre" class="btn btn-info"><i class="fa fa-check-circle"></i> {{_('Enregistrer')}}</button>
      </div>
      </form>
    </div>
  </div>
</div>
